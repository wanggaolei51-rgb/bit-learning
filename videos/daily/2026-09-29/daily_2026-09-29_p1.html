const $ = id => document.getElementById(id);
const CJK = /[\u4e00-\u9fff\u3400-\u4dbf]/;
function tokenCount(text){
  let latin=0, cjk=0;
  const words = String(text).split(/\s+/).filter(Boolean);
  for(const w of words){
    const cjkChars = (w.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
    cjk += cjkChars;
    latin += (w.replace(/[\u4e00-\u9fff\u3400-\u4dbf]/g,'').match(/[A-Za-z0-9'-]+/g)||[]).length;
  }
  return latin + cjk/1.8;
}
function estMs(text, lang){
  if(lang==='id') return Math.round(tokenCount(text)*400)+300;
  const cjkChars=(String(text).match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
  const latin=(String(text).replace(/[\u4e00-\u9fff\u3400-\u4dbf]/g,'').match(/[A-Za-z0-9'-]+/g)||[]).length;
  return Math.round(cjkChars*280 + latin*400)+300;
}

function pickVoice(lang){
  const p = lang==='id' ? 'id' : 'zh';
  const hit = VOICES.filter(v => (v.lang||'').toLowerCase().replace('_','-').startsWith(p));
  return hit[0] || null;
}
function speak(text, lang, onend){
  const u = new SpeechSynthesisUtterance(text);
  if(lang==='id'){ u.lang='id-ID'; } else { u.lang='zh-CN'; }
  const v = pickVoice(lang); if(v) u.voice = v;
  u.rate = 0.96; u.pitch = 1.0;
  let ended = false;
  const est = estMs(text, lang);
  const hard = setTimeout(()=>{ if(!ended){ ended=true; try{speechSynthesis.cancel();}catch(e){} onend&&onend(); } }, est*3 + 8000);
  u.onend = ()=>{ if(!ended){ ended=true; clearTimeout(hard); onend&&onend(); } };
  u.onerror = ()=>{ if(!ended){ ended=true; clearTimeout(hard); onend&&onend(); } };
  speechSynthesis.speak(u);
}

            `<div class="h-cn">${esc(b.cn)}</div>`+
            (b.en?`<div class="h-en">${esc(b.en)}</div>`:'');
        break;
      case 'pairs':
        h = `<div class="b-title">${esc(b.title)}</div>` +
            b.rows.map(r=>`<div class="prow"><span class="pw">${esc(r[0])}</span><span class="pc">${esc(r[1]||'')}</span></div>`).join('');
        break;
      case 'table':
        h = `<div class="b-title">${esc(b.title)}</div><div class="tbl">` +
            b.rows.map(r=>`<div class="trow"><span class="tcell f">${esc(r[0])}</span><span class="tcell p">${esc(r[1]||'')}</span><span class="tcell m">${esc(r[2]||'')}</span></div>`).join('') +
            `</div>`;
        break;
      case 'example':
        h = `<div class="b-title">CONTOH · 例句</div>`+
            `<div class="ex-id">${esc(b.id)}</div>`+
            (b.zh?`<div class="ex-zh">${esc(b.zh)}</div>`:'');
        break;
      default:
        h = `<div class="sub">${esc(b.raw||'')}</div>`;
    }
  }
  card.classList.remove('fadein'); void card.offsetWidth;
  card.innerHTML = h; card.classList.add('fadein');
  
  $('uiBar').style.width = (SEQ.length? (cur/SEQ.length)*100 : 0) + '%';
  if(item.wordIdx){ $('uiWord').textContent = item.wordIdx; }
  else{
    
    for(let i=cur;i>=0;i--){ if(SEQ[i].wordIdx){ $('uiWord').textContent = SEQ[i].wordIdx; break; } }
  }
  
  const ws = partWords();
  const firstBeat = {};
  SEQ.forEach((it,i)=>{ if(it.wordIdx!=null && !(it.wordIdx in firstBeat)) firstBeat[it.wordIdx]=i; });
  document.querySelectorAll('.dot').forEach((d,i)=>{
    const w = ws[i];
    d.classList.toggle('done', (w in firstBeat) && firstBeat[w] < cur);
    d.classList.toggle('cur', item.wordIdx===w);
  });
}
function partWords(){ return EPISODE.segments.filter(s=>s.type==='word').map(s=>s.idx); }
function buildDots(){
  const box = $('uiDots'); box.innerHTML='';
  partWords().forEach((w,i)=>{
    const btn = document.createElement('button');
    btn.className='dot'; btn.title='Kata '+w;
    btn.onclick = ()=> jumpToWord(w);
    box.appendChild(btn);
  });
}


function postProgress(item, done){
  try{
    if(!window.parent || window.parent===window) return;
    window.parent.postMessage({type:'video_progress', wordIdx: item.wordIdx||lastWordIdx(), done:!!done}, location.origin);
  }catch(e){}
}
function lastWordIdx(){ const ws=partWords(); return ws.length?ws[ws.length-1]:0; }

function playBeat(idx){
  const my = ++beatToken;
  cur = idx;
  const item = SEQ[cur]; if(!item) return finish();
  renderBeat(item);
  if(item.wordIdx && !wordDone[item.wordIdx]){
    wordDone[item.wordIdx]=true; postProgress(item,false);
  }
  const b = item.beat;
  const utts = b.tts || [];
  const ests = utts.map(u=>estMs(u.t,u.l));
  const sumEst = ests.reduce((a,c)=>a+c,420);
  const maxMin = utts.reduce((a,u)=>Math.max(a,minShowMs(u.t)),0);
  const floor = Math.max(sumEst, maxMin);
  const t0 = performance.now();
  curUtt = 0;
  
  const hardBeat = setTimeout(()=>{ if(my!==beatToken) return; forceAdvance(); }, sumEst*3 + 15000);
  const cleanup = ()=> clearTimeout(hardBeat);
  const nextUtt = ()=>{
    if(my!==beatToken){ cleanup(); return; }
    if(curUtt < utts.length){
      const u = utts[curUtt++];
      speak(u.t, u.l, ()=> setTimeout(()=>{ if(my===beatToken) nextUtt(); }, 420));
    }else{
      
      const shown = performance.now()-t0;
      const wait = floor - shown;
      if(wait>0) setTimeout(()=>{ if(my===beatToken){ cleanup(); advance(); } }, wait);
      else { cleanup(); advance(); }
    }
  };
  nextUtt();
}
function forceAdvance(){ try{speechSynthesis.cancel();}catch(e){} advance(); }
function advance(){
  if(cur+1 < SEQ.length) playBeat(cur+1);
  else finish();
}
function finish(){
  phase='end';
  postProgress({wordIdx:lastWordIdx()}, true);
  try{speechSynthesis.cancel();}catch(e){}
  const total=Math.min(EPISODE.parts,EPISODE.availableParts||EPISODE.parts);
  const hasNext=(EPISODE.part||1)<total;
  const e = $('uiEnd');
  e.style.display='flex';
  $('endBig').textContent = hasNext?'▶':'🎉';
  $('endSub').textContent = hasNext
    ? 'BAGIAN '+EPISODE.part+' SELESAI · 即将继续第 '+(EPISODE.part+1)+' 集'
    : 'BAGIAN '+EPISODE.part+' SELESAI · 第 '+EPISODE.part+' 集完成';
  if(hasNext){ setTimeout(()=>{ location.href='./daily_'+EPISODE.date+'_p'+(EPISODE.part+1)+'.html'; }, 1400); }
  setTimeout(()=>{ e.style.display='none'; }, 2600);
}


function jumpToWord(w){
  const i = SEQ.findIndex(it=> it.wordIdx===w);
  if(i>=0){ phase='play'; $('btnPlay').textContent='⏸'; try{speechSynthesis.cancel();}catch(e){} playBeat(i); }
}
function nearestWordStep(dir){
  const item = SEQ[cur]; if(!item) return;
  const ws = partWords();
  let pos;
  if(item.wordIdx==null){
    
    if(dir>0){ for(let i=cur+1;i<SEQ.length;i++){ if(SEQ[i].wordIdx){ playBeat(i); return; } } finish(); return; }
    else{ for(let i=cur-1;i>=0;i--){ if(SEQ[i].wordIdx){ playBeat(i); return; } } return; }
  }
  pos = ws.indexOf(item.wordIdx) + dir;
  if(pos<0 || pos>=ws.length) return;
  jumpToWord(ws[pos]);
}
$('btnPlay').onclick = ()=>{
  if(phase==='play'){
    phase='paused'; $('btnPlay').textContent='▶';
    beatToken++; try{speechSynthesis.cancel();}catch(e){}
  }else if(phase==='paused'){
    phase='play'; $('btnPlay').textContent='⏸';
    playBeat(cur);   
  }
};
$('btnPrev').onclick = ()=> nearestWordStep(-1);
$('btnNext').onclick = ()=> nearestWordStep(1);
$('btnRestart').onclick = ()=>{ phase='play'; $('btnPlay').textContent='⏸'; wordDone={}; playBeat(0); };


function start(){
  if(phase!=='gate') return;
  phase='play';
  $('uiGate').style.display='none';
  $('btnPlay').textContent='⏸';
  let begin = 0;
  const rp = new URLSearchParams(location.search).get('resume');
  if(rp){ const w=parseInt(rp,10); const i=SEQ.findIndex(it=>it.wordIdx===w); if(i>=0) begin=i; }
  playBeat(begin);
}
(function init(){
  $('uiPart').textContent = EPISODE.part;
  $('uiParts').textContent = EPISODE.parts;
  $('uiWords').textContent = EPISODE.wordCount;
  const meta = EPISODE.topic||{};
  $('gateKicker').textContent = (meta.label? meta.label+' · ':'') + 'LEO-BIR · VIDEO HARIAN';
  $('gateTitle').textContent = (meta.cn||'') + ' · ' + (EPISODE.wordCount||'') + ' kata';
  $('gateMeta').textContent = 'BAGIAN '+EPISODE.part+' / '+EPISODE.parts + ' · ' + EPISODE.date;
  $('uiWord').textContent = (partWords()[0]||'–');
  buildDots();
  renderBeat(SEQ[0]||{beat:{type:'open',lines:[''],kicker:''}});
  $('uiGate').addEventListener('click', start);
})();
</script>
</body>
</html>
