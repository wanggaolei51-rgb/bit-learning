function hlSpans(line,hl){let s=line;const low=s.toLowerCase(),marks=[];
  hl.forEach(h=>{const hw=h.toLowerCase();let i=0;
    while((i=low.indexOf(hw,i))!==-1){marks.push([i,i+hw.length]);i+=hw.length}});
  marks.sort((a,b)=>a[0]-b[0]);
  const merged=[];marks.forEach(m=>{const last=merged[merged.length-1];
    if(last&&m[0]<last[1])last[1]=Math.max(last[1],m[1]);else merged.push([m[0],m[1]])});
  const parts=[];let pos=0;
  merged.forEach(([a,b])=>{if(a>pos)parts.push({t:s.slice(pos,a),h:0});
    parts.push({t:s.slice(a,b),h:1});pos=b});
  if(pos<s.length)parts.push({t:s.slice(pos),h:0});
  return parts.length?parts:[{t:s,h:0}]}

function estW(s,fs){let w=0;for(const ch of s){const c=ch.codePointAt(0);
  w+=((c>=0x2E80&&c<=0x9FFF)||(c>=0x3000&&c<=0x30FF)||(c>=0xFF00&&c<=0xFFEF))?fs:fs*0.52}return w}
function wrapWords(s,fs,maxW){const ws=s.split(/\s+/),lines=[];let cur="";
  for(const w of ws){const t=cur?cur+" "+w:w;
    if(estW(t,fs)>maxW&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines.length?lines:[s]}
function wrapChars(s,fs,maxW){const lines=[];let cur="";
  for(const ch of s){const t=cur+ch;
    if(estW(t,fs)>maxW&&cur){lines.push(cur);cur=ch}else cur=t}
  if(cur)lines.push(cur);return lines.length?lines:[s]}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tokenCount(text){
  let latin=0, cjk=0;
  for(const w of String(text).split(/\s+/).filter(Boolean)){
    cjk += (w.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
    latin += (w.replace(/[\u4e00-\u9fff\u3400-\u4dbf]/g,'').match(/[A-Za-z0-9'-]+/g)||[]).length;
  }
  return latin + cjk/1.8;
}
function estMs(text){ return Math.round(tokenCount(text)*350)+250; }
function minShowMs(text){ return Math.round(1050 + tokenCount(text)*320); }

      if(b.kind==='head'){ bubText=b.word; hl=[b.word]; }
      else if(b.kind==='example'){ bubText=u.t; hl=[b.word].filter(Boolean); }
      else if(b.type==='preview'||b.type==='review'){ bubText=u.t; markRow(curUtt); }
      showBubble(sp,bubText,hl);
      speakFx(chars[sp]);
      const myUtt=curUtt;
      speakId(u.t, ()=>{ if(my!==beatToken){cleanup();return;}
        setTimeout(()=>{ if(my===beatToken) nextUtt(); }, 220); });
      curUtt++;
      void myUtt;
    }else{
      markRow(-1);
      const shown=performance.now()-t0;
      const wait=floorMs-shown;
      if(wait>0) setTimeout(()=>{ if(my===beatToken){ cleanup(); advance(); } }, wait);
      else{ cleanup(); advance(); }
    }
  };
  if(utts.length){ nextUtt(); }
  else{ 
    const wait=Math.max(minShowMs(b.lines?b.lines.join(' '):''),1200);
    setTimeout(()=>{ if(my===beatToken){ cleanup(); advance(); } }, wait);
  }
}
function forceAdvance(){ try{speechSynthesis.cancel();}catch(e){} advance(); }
function advance(){ if(cur+1<SEQ.length) playBeat(cur+1); else finish(); }
function finish(){
  phase='end';
  postProgress({wordIdx:lastWordIdx()},true);
  try{speechSynthesis.cancel();}catch(e){}
  const next=(EPISODE.nav||[]).find(n=>n.part===(EPISODE.part+1) && n.exists);
  const e=$('uiEnd');
  e.style.display='flex';
  $('endBig').textContent=next?'▶':'🎉';
  $('endSub').textContent=next?('BAGIAN '+EPISODE.part+' SELESAI · 即将继续第 '+(EPISODE.part+1)+' 集'):('BAGIAN '+EPISODE.part+' SELESAI · 第 '+EPISODE.part+' 集完成');
  if(next){ setTimeout(()=>{ location.href=next.file; },1400); }
  setTimeout(()=>{ e.style.display='none'; },2600);
}
function postProgress(item, done){
  try{
    if(!window.parent || window.parent===window) return;
    window.parent.postMessage({type:'video_progress', wordIdx: item.wordIdx||lastWordIdx(), done:!!done}, location.origin);
  }catch(e){}
}
function lastWordIdx(){ const ws=partWords(); return ws.length?ws[ws.length-1]:0; }


function jumpToWord(w){
  const i=SEQ.findIndex(it=>it.wordIdx===w);
  if(i>=0){ phase='play'; $('btnPlay').textContent='⏸'; try{speechSynthesis.cancel();}catch(e){} playBeat(i); }
}
function nearestWordStep(dir){
  const item=SEQ[cur]; if(!item) return;
  const ws=partWords();
  if(item.wordIdx==null){
    if(dir>0){ for(let i=cur+1;i<SEQ.length;i++){ if(SEQ[i].wordIdx){ playBeat(i); return; } } finish(); return; }
    else{ for(let i=cur-1;i>=0;i--){ if(SEQ[i].wordIdx){ playBeat(i); return; } } return; }
  }
  const pos=ws.indexOf(item.wordIdx)+dir;
  if(pos<0||pos>=ws.length) return;
  jumpToWord(ws[pos]);
}
function buildDots(){
  const box=$('uiDots'); box.innerHTML='';
  partWords().forEach(w=>{
    const btn=document.createElement('button');
    btn.className='dot'; btn.title='Kata '+w;
    btn.onclick=()=>jumpToWord(w);
    box.appendChild(btn);
  });
}
function renderNav(){
  const box=$('uiNav'); box.innerHTML='';
  (EPISODE.nav||[]).forEach(n=>{
    if(n.current){
      const s=document.createElement('span');
      s.className='nav-pill cur'; s.textContent=n.label; box.appendChild(s);
    }else if(n.exists){
      const a=document.createElement('a');
      a.className='nav-pill'; a.textContent=n.label; a.href=n.file; box.appendChild(a);
    }else{
      const s=document.createElement('span');
      s.className='nav-pill dis'; s.textContent=n.label; box.appendChild(s);
    }
  });
}
$('btnPlay').onclick=()=>{
  if(phase==='play'){ phase='paused'; $('btnPlay').textContent='▶'; beatToken++; try{speechSynthesis.cancel();}catch(e){} }
  else if(phase==='paused'){ phase='play'; $('btnPlay').textContent='⏸'; playBeat(cur); }
};
$('btnPrev').onclick=()=>nearestWordStep(-1);
$('btnNext').onclick=()=>nearestWordStep(1);
$('btnRestart').onclick=()=>{ phase='play'; $('btnPlay').textContent='⏸'; wordDone={}; playBeat(0); };


function start(){
  if(phase!=='gate') return;
  phase='play';
  $('uiGate').style.display='none';
  $('btnPlay').textContent='⏸';
  let begin=0;
  const rp=new URLSearchParams(location.search).get('resume');
  if(rp){ const w=parseInt(rp,10); const i=SEQ.findIndex(it=>it.wordIdx===w); if(i>=0) begin=i; }
  playBeat(begin);
}
(function init(){
  $('uiPart').textContent=EPISODE.part;
  $('uiParts').textContent=EPISODE.parts;
  $('uiWords').textContent=EPISODE.wordCount;
  const meta=EPISODE.topic||{};
  $('gateKicker').textContent=(meta.label?meta.label+' · ':'')+'LEO-BIR · VIDEO HARIAN';
  $('gateTitle').textContent=(meta.cn||'')+' · '+(EPISODE.wordCount||'')+' kata';
  $('gateMeta').textContent='BAGIAN '+EPISODE.part+' / '+EPISODE.parts+' · '+EPISODE.date;
  $('uiWord').textContent=(partWords()[0]||'–');
  buildDots(); renderNav();
  
  const q=new URLSearchParams(location.search).get('shot');
  if(q!==null){
    const i=Math.max(0,Math.min(SEQ.length-1,parseInt(q,10)||0));
    $('uiGate').style.display='none';
    phase='shot'; $('btnPlay').textContent='▶';
    cur=i;
    const item=SEQ[i]; const b=item.beat;
    const scene=(b.scene)||(item.seg.scene)||'plant';
    renderScene(scene); curScene=scene;
    renderPanel(item);
    if(b.kind==='example'){ showBubble(speakerFor(b), b.id||((b.tts||[])[0]||{}).t||'', [b.word].filter(Boolean)); caption(b.zh||''); }
    $('uiBar').style.width=(SEQ.length?(i/SEQ.length)*100:0)+'%';
    document.querySelectorAll('.dot').forEach((d,di)=>{ d.classList.toggle('cur', SEQ[i].wordIdx===partWords()[di]); });
    return;
  }
  renderScene((SEQ[0]&&((SEQ[0].beat.scene)||(SEQ[0].seg.scene)))||'plant');
  curScene=(SEQ[0]&&((SEQ[0].beat.scene)||(SEQ[0].seg.scene)))||'plant';
  renderPanel(SEQ[0]||{beat:{type:'open',lines:[''],kicker:''}});  
  $('uiGate').addEventListener('click',start);
})();
</script>
